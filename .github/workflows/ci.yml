name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # The rules on main require this check by name, so change them together.
    name: Build and test
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install zstd
        run: brew install zstd

      - name: Show the tools
        run: |
          sw_vers
          swift --version

      - name: Check the scripts
        run: |
          for script in Scripts/*.sh tools/*.sh; do bash -n "$script"; done
          # The cache goes to the runner's temp folder, so nothing is written into the checkout.
          python3 -I -X pycache_prefix="$RUNNER_TEMP/pycache" -m py_compile Scripts/*.py tools/*.py

      - name: Run the tests
        run: swift test

      # The plugin's developer tools are left out of every other build, so this keeps them compiling.
      - name: Build the plugin with its developer tools
        run: swift build --product StarshipPlugin -Xswiftc -DSTARSHIP_DEVELOPER

      # Strings only the developer code has. Two are under 16 bytes, which Swift may keep out of the string table, so the
      # developer build must show them all, or the check of the app's plugin below has gone blind.
      - name: Check the developer tools are in the developer plugin
        run: |
          strings -a .build/debug/libStarshipPlugin.dylib > "$RUNNER_TEMP/developer-strings"
          for tool in "watch-tables" "Plugin/command" "Watching FM's screens for tables" "Dumped FM's interface"; do
            grep -qF -- "$tool" "$RUNNER_TEMP/developer-strings" || { echo "Not in the developer plugin: $tool"; exit 1; }
          done

      - name: Check the interpreter against the CPU
        run: tools/run-emutest.sh

      - name: Build the app
        run: Scripts/build-app.sh

      - name: Check the plugin in the app has no developer tools
        run: |
          strings -a "build/FM Starship.app/Contents/Frameworks/libStarshipPlugin.dylib" > "$RUNNER_TEMP/plugin-strings"
          for tool in "watch-tables" "Plugin/command" "Watching FM's screens for tables" "Dumped FM's interface"; do
            if grep -qF -- "$tool" "$RUNNER_TEMP/plugin-strings"; then echo "Developer tool in the normal plugin: $tool"; exit 1; fi
          done
